<style>

:root{

  --omr:#A3245E; --omr-soft:#F7E8EF; --graphite:#2B2F36;
  --ok:#1F7A3D; --ok-soft:#E5F3E9; --bad:#B8322A; --bad-soft:#FBE9E7; --skip:#8A6D1E; --skip-soft:#FBF3DD;
  --f-display:"Tiro Bangla","Noto Sans Bengali",serif;
  --f-body:"Noto Sans Bengali","Noto Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111318; --sheet:#181B22; --ink:#E7E9EF; --muted:#9AA1B2; --line:#30323C;
  --omr:#E58AB2; --omr-soft:#2C1C25; --graphite:#E7E9EF;
  --ok:#62C483; --ok-soft:#18291F; --bad:#F07A70; --bad-soft:#331C1A; --skip:#E0BE62; --skip-soft:#2E2816;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111318; --sheet:#181B22; --ink:#E7E9EF; --muted:#9AA1B2; --line:#30323C;
  --omr:#E58AB2; --omr-soft:#2C1C25; --graphite:#E7E9EF;
  --ok:#62C483; --ok-soft:#18291F; --bad:#F07A70; --bad-soft:#331C1A; --skip:#E0BE62; --skip-soft:#2E2816;
  color-scheme:dark}

.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-size:13px;line-height:1}

.fb.ok b.v{color:var(--ok)} .fb.bad b.v{color:var(--bad)} .fb.skip b.v{color:var(--skip)}
footer{color:var(--muted);font-size:13px;padding-block:0 40px}
.past-intro{color:var(--muted);font-size:15px;margin:16px 0 4px;line-height:1.8}
.pf{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.jump button[aria-pressed="true"]{background:var(--omr);border-color:var(--omr);color:var(--sheet)}
.pq{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ph{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.uni{font-family:var(--f-mono);font-weight:500;color:var(--omr);font-size:14px}

<script>
/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x;do{x=ri(a,b)}while(x===0);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const bn=s=>String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const fm=x=>{const s=Number.isInteger(x)?String(x):String(Math.round(x*100)/100);return s.replace('-','−')};
const p=x=>x<0?'('+fm(x)+')':fm(x);
const mul=(a,b)=>p(a)+' × '+p(b);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frac=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?fm(n):fm(n)+'/'+d};
function surd(n){if(n===0)return'0';let k=1,m=n;for(let f=2;f*f<=m;f++){while(m%(f*f)===0){m/=f*f;k*=f}}return m===1?String(k):(k===1?'':k)+'√'+m}
function terms(c,vars){const out=[];const u=['i','j','k'];c.forEach((a,k)=>{if(a===0)return;const ab=Math.abs(a);const co=ab===1?'':ab;const body=co+vars[k]+'['+u[k]+']';out.push(out.length===0?(a<0?'−':'')+body:(a<0?' − ':' + ')+body)});return out.join('')||'0'}
const vs=c=>terms(c,['','','']);
const render=s=>s.replace(/\{([^}]+)\}/g,'<span class="vec">$1</span>').replace(/\[([ijknA-Z])\]/g,(m,c)=>'<span class="hat">'+({i:'ı',j:'ȷ'}[c]||c)+'</span>');

/*@@TOPICS@@*/

/*@@BANK@@*/

/*@@TEMPLATES@@*/

/* ---------- build a question ---------- */
function fromBank(b){return{bi:BANK.indexOf(b),ti:-1,topic:b.t,src:'bank',text:b.q,exp:b.e,opts:shuffle(b.o.map((h,i)=>({h,ok:i===b.a,note:(b.w||{})[i]||''})))}}
function fromTpl(fn){for(let i=0;i<40;i++){const r=fn();const seen=new Set([r.c]),d=[];for(const[v,n]of r.d){if(!seen.has(v)){seen.add(v);d.push({h:v,ok:false,note:n})}if(d.length===3)break}
 if(d.length===3)return{bi:-1,ti:TPL.indexOf(fn),topic:r.t,src:'tpl',text:r.q,exp:r.e,opts:shuffle([{h:r.c,ok:true,note:''},...d])}}throw new Error('template failed')}

const TT=TPL.map(f=>f().t);
/*@@PAST@@*/
function pastQ(k){if(k.startsWith('t:'))return fromTpl(TPL[TI[k.slice(2)]]);const b=BANK.find(x=>x.q.includes(k.slice(2)));return fromBank(b)}

/* each slot draws a topic by its admission share (weak topics ×3), then a bank question or a template from it; a drawn topic's share shrinks so tests stay varied */
function makeTest(n,weak,seen){
 if(n==='all')return shuffle(BANK.map(fromBank).concat(TPL.map(fromTpl)));
 seen=seen||{b:new Set(),t:new Set()};
 const wk=weak||{},w={};for(const t in TW)w[t]=TW[t]*(wk[t]?3:1);
 const uB=new Set(),uT=new Set(),qs=[];let guard=0;
 while(qs.length<n&&guard++<500){
  const keys=Object.keys(w).filter(t=>w[t]>0);if(!keys.length)break;
  let r=Math.random()*keys.reduce((s,t)=>s+w[t],0),t=keys[keys.length-1];for(const k of keys){r-=w[k];if(r<0){t=k;break}}
  const b=BANK.map((_,i)=>i).filter(i=>BANK[i].t===t&&!uB.has(i)),all=TT.map((_,i)=>i).filter(i=>TT[i]===t),tp=all.filter(i=>!uT.has(i));
  if(tp.length&&(!b.length||Math.random()<0.45)){const tu=tp.filter(i=>!seen.t.has(i)),i=pick(tu.length?tu:tp);uT.add(i);qs.push(fromTpl(TPL[i]))}
  else if(b.length){const bu=b.filter(i=>!seen.b.has(i)),i=pick(bu.length?bu:b);uB.add(i);qs.push(fromBank(BANK[i]))}
  else if(all.length)qs.push(fromTpl(TPL[pick(all)]));
  else{w[t]=0;continue}
  w[t]*=0.7}
 return shuffle(qs)}

if(typeof module!=='undefined'){module.exports={makeTest,BANK,TPL,fromTpl};}
